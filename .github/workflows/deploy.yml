# 코드를 올리면(push) GitHub가 자동으로 웹사이트를 만들어 GitHub Pages에 올려줍니다.
# 결과 주소: https://xieva.github.io/help_read/
name: 웹사이트 배포

on:
  push:
    branches:
      - main
      - claude/reading-app-prototype-d81vuv
  workflow_dispatch: # GitHub의 Actions 탭에서 직접 실행 버튼으로도 돌릴 수 있게

permissions:
  contents: write # 만든 결과물을 gh-pages 브랜치에 올리기 위해 필요

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 필요한 도구 설치
        run: npm ci

      - name: 웹사이트 파일 만들기 (out 폴더)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: gh-pages 브랜치에 올리기
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
